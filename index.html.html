<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria com Contador</title>
    <link rel="stylesheet" href="styles.css"> <!-- Link para o arquivo de CSS externo -->
</head>
<body>
    <div class="overlay" id="overlay">
        <button onclick="unlockSite()">Clique aqui. ❤️</button>
    </div>
    
    <!-- Galeria de Imagens -->
    <div class="gallery-container">
        <div class="gallery-track">
            <img src="D:\meus sites\amor 3\images\imagem 1.jpg" alt="Imagem 1">
            <img src="D:\meus sites\amor 3\images\imagem 2.jpg" alt="Imagem 2">
            <img src="D:\meus sites\amor 3\images\imagem 3.jpg" alt="Imagem 3">
            <img src="D:\meus sites\amor 3\images\imagem 4.jpg" alt="Imagem 4">
            <img src="D:\meus sites\amor 3\images\imagem 5.jpg" alt="Imagem 5">
        </div>
    </div>
    
    <!-- Texto Principal -->
    <div class="counter-container">
        <h2>Obrigado por todo esse tempo ao meu lado, esses dias tem sido os melhores da minha vida, você é e sempre será meu porto seguro, nem nos melhores sonhos eu imaginaria ter alguém tão especial quanto você, obrigado por esses</h2>
    </div>
    
    <!-- Contador de Tempo -->
    <div class="counter-container">
        <div id="counter" class="counter"></div>
    </div>
    
    <!-- Palavra "Juntos" -->
    <h1 class="larger-juntos">Juntos</h1>
    
    <!-- Video -->
    <div class="video-container">
        <h3>Dedicada a Você</h3>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/Af7ieNv0wXY" frameborder="0" allowfullscreen></iframe>
    </div>
    
    <!-- Frase Final -->
    <h2 id="final-message">
        ❤️ Obrigado por tudo, Te Amo para sempre. ❤️
    </h2>

    <script src="script.js"></script> <!-- Link para o arquivo de JavaScript externo -->
</body>
</html>
